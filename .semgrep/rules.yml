rules:
  # ── Rust 代码禁令：调试残留、跳过测试、不受管构建与显式退出 ──
  - id: no-dbg-macro
    patterns:
      - pattern: dbg!(...)
    message: "`dbg!()` is for debugging only. Remove before committing."
    severity: ERROR
    languages: [rust]
  - id: no-todo-unimplemented
    patterns:
      - pattern-either:
          - pattern: todo!()
          - pattern: unimplemented!()
    message: "`todo!()` and `unimplemented!()` panic at runtime. Replace with a real implementation or a compile-time marker."
    severity: ERROR
    languages: [rust]
  - id: no-process-exit
    patterns:
      - pattern: std::process::exit($ARG)
    message: "`std::process::exit()` kills the process immediately without cleanup. Return an error instead."
    severity: ERROR
    languages: [rust]
  - id: no-test-ignore-attribute
    pattern-regex: '#\[ignore'
    message: "#[ignore] hides failures. spec TESTING bans silent skips."
    severity: ERROR
    languages: [rust]
  - id: no-test-skip-diagnostic
    pattern-regex: 'eprintln!\("SKIP:'
    message: "SKIP logs hide missing preconditions. Assert them instead."
    severity: ERROR
    languages: [rust]
  - id: no-rust-test-early-return
    patterns:
      - pattern: return;
      - pattern-inside: |
          #[test]
          fn $NAME(...) {
            ...
          }
    message: "bare return in #[test] passes vacuously. Assert preconditions."
    severity: ERROR
    languages: [rust]
  - id: no-eprintln-library
    patterns:
      - pattern: eprintln!(...)
    message: "`eprintln!` in library code writes to stderr. Use a logging framework instead."
    severity: ERROR
    languages: [rust]
    paths:
      exclude:
        - "**/*/tests/*"
        # cfg(test)-gated bless/progress diagnostics; test-only output.
        - "**/snapshot_test.rs"
  - id: no-criterion-black-box
    patterns:
      - pattern-either:
          - pattern-regex: '\bcriterion::black_box\b'
          - pattern-regex: 'use criterion::\{[^}]*\bblack_box\b'
    message: "Use std::hint::black_box, not criterion::black_box."
    severity: ERROR
    languages: [rust]
  - id: no-unmanaged-build-command
    patterns:
      - pattern: $CMD::new($PROG, ...)
      - metavariable-regex:
          metavariable: $CMD
          regex: '.*Command'
      - metavariable-regex:
          metavariable: $PROG
          regex: '(?s).*(cargo|gradle).*'
    message: "Unmanaged builds are forbidden; use nix develop tooling."
    severity: ERROR
    languages: [rust]
  - id: no-forbidden-env-var-set
    pattern-regex: '(set_var|\.env)\("(LD_LIBRARY_PATH|PWD|LD_PRELOAD)"'
    message: "Setting LD_LIBRARY_PATH/PWD/LD_PRELOAD is forbidden by spec."
    severity: ERROR
    languages: [rust]
  - id: no-embedded-proot
    pattern-regex: '\bproot\b'
    message: "Embedded proot is forbidden by spec; remove related code."
    severity: ERROR
    languages: [rust, kotlin]
    paths:
      exclude:
        - "**/src/test/**"
        - "**/src/androidTest/**"
        - "**/tests/**"
  - id: no-termux-api-refs
    pattern-regex: 'termux-api|termux_api|termux\.env\b'
    message: "termux-api and termux.env are forbidden by spec."
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "**/*.rs"
        - "**/*.kt"
        - "**/*.kts"
        - "**/*.md"
        - "**/*.yml"
        - "**/*.nix"
        - "**/*.nu"
        - "**/*.toml"
      exclude:
        - "/.semgrep/**"
        - "/docs/specification/*"
        - "/README.md"
  - id: no-deprecated-bootstrap-values
    pattern-regex: 'apt-android-5\b|2022\.04\.28\b'
    message: "Old bootstrap presets are forbidden; use current values."
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "**/*.rs"
        - "**/*.kt"
        - "**/*.kts"
        - "**/*.md"
        - "**/*.yml"
        - "**/*.nix"
        - "**/*.nu"
        - "**/*.toml"
      exclude:
        - "/.semgrep/**"
        - "/docs/specification/*"
        - "/README.md"
  - id: no-bootstrap-sidecar
    pattern-regex: '\bsidecar\b'
    message: "Bootstrap sha256 sidecar checks are forbidden by spec."
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "**/*.rs"
        - "**/*.kt"
        - "**/*.kts"
        - "**/*.md"
        - "**/*.yml"
        - "**/*.nix"
        - "**/*.nu"
        - "**/*.toml"
      exclude:
        - "/.semgrep/**"
        - "/docs/specification/*"
        - "/README.md"
  - id: no-prohibited-shells
    pattern-regex: '\b(fish|dash|zsh)\b'
    message: "fish/dash/zsh must not appear in code."
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "**/*.rs"
        - "**/*.kt"
        - "**/*.kts"
        - "**/*.md"
        - "**/*.yml"
        - "**/*.nix"
        - "**/*.nu"
        - "**/*.toml"
      exclude:
        - "/.semgrep/**"
        - "/docs/specification/*"
        - "/README.md"
  - id: no-torvox-identifier
    pattern-regex: '[Tt]orvox'
    message: "Use generic terms; Torvox only in intro docs."
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "**/*.rs"
        - "**/*.kt"
        - "**/*.kts"
        - "**/*.md"
        - "**/*.yml"
        - "**/*.nix"
        - "**/*.nu"
        - "**/*.toml"
      exclude:
        - "/.semgrep/**"
        - "/docs/specification/*"
        - "/README.md"
  - id: no-nix-store-paths
    pattern-regex: 'nix/store'
    message: "Hardcoded nix store paths are forbidden in code."
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "**/*.rs"
        - "**/*.kt"
        - "**/*.kts"
        - "**/*.md"
        - "**/*.yml"
        - "**/*.nix"
        - "**/*.nu"
        - "**/*.toml"
      exclude:
        - "/.semgrep/**"
        - "/docs/specification/*"
        - "/README.md"
        - "/native/build.rs"
        - "/android/build.gradle.kts"
  - id: no-zigbuild
    pattern-regex: 'zigbuild'
    message: "Use cargo ndk for Android builds, not cargo zigbuild."
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "**/*.rs"
        - "**/*.kt"
        - "**/*.kts"
        - "**/*.md"
        - "**/*.yml"
        - "**/*.nix"
        - "**/*.nu"
        - "**/*.toml"
      exclude:
        - "/.semgrep/**"
        - "/docs/specification/*"
        - "/README.md"
  # Repo tooling rules (generic): manifests, scripts and workflows.
  # check-rust.nu scans this file, so they live here.
  - id: no-crate-features
    pattern-regex: '^\[features\]'
    message: "Crate features are forbidden by spec."
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "**/Cargo.toml"
  - id: no-nu-which-lookup
    pattern-regex: '\bwhich\s'
    message: "Tools come from nix develop; no which lookup in scripts."
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "**/scripts/*.nu"
  - id: no-nu-ignore-errors
    pattern-regex: 'do\s+--ignore-errors'
    message: "Let failures propagate; no do --ignore-errors in scripts."
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "**/scripts/*.nu"
  - id: no-nu-stderr-devnull
    pattern-regex: 'err>\s*/dev/null|\be\|>\s*null'
    message: "Stderr is diagnostic; never redirect it to /dev/null."
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "**/scripts/*.nu"
  - id: no-nu-pipe-ignore
    pattern-regex: '\|\s*ignore'
    message: "Handle errors explicitly; no pipe-to-ignore suppression."
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "**/scripts/*.nu"
  - id: no-nu-step-label
    pattern-regex: 'print\s+"==='
    message: "No === step labels in scripts; output results only."
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "**/scripts/*.nu"
  - id: no-nu-done-print
    pattern-regex: 'print\s+"(Done!|Boot verified)"'
    message: "No Done!/Boot-verified style prints."
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "**/scripts/*.nu"
  - id: no-pinned-action-version
    patterns:
      - pattern-regex: 'uses:\s*\S+@v?[0-9]'
      - pattern-not-regex: 'reactivecircus/android-emulator-runner@v2'
    message: "Actions must track default branch (@main/@master)."
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "**/.github/workflows/*.yml"
  # ---------------------------------------------------------------- 许可证文件
  # 仓库不放任何上游许可证文件。血统与出处记在 openspec 规范里（指向标签与仓库地址），
  # 而不是把别人的法律文本复制进来：复制件会随上游改版失效，且没有任何构建步骤读它。
  - id: no-license-files
    pattern-regex: '(?s).'
    message: "不得存放许可证文件（LICENSE/COPYING/NOTICE）。血统记在 openspec/specs/upstream-alignment，指向标签与上游仓库地址，不复制上游法律文本。"
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "**/LICENSE"
        - "**/LICENSE.txt"
        - "**/LICENSE.md"
        - "**/COPYING"
        - "**/COPYING.txt"
        - "**/NOTICE"
        - "**/NOTICE.txt"
  # 标准许可证头标记：文件不叫 LICENSE 但带这类开头的，同样是复制的法律文本。
  - id: no-license-text
    pattern-regex: '(?im)^\s*(Permission is hereby granted, free of charge|GNU GENERAL PUBLIC LICENSE|Apache License, Version 2\.0|MIT License)'
    message: "不得复制上游许可证文本。血统与出处记在 openspec 规范里，不复制法律文本。"
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "**/*.rs"
        - "**/*.kt"
        - "**/*.kts"
        - "**/*.md"
        - "**/*.nu"
        - "**/*.nix"
        - "**/*.yml"
        - "**/*.yaml"
        - "**/*.toml"
      exclude:
        - "/.semgrep/**"
        - "/docs/specification/*"
  # ------------------------------------------------- git/cargo 等外部构建命令
  # 产物只能来自 nix develop。源码里起 git/cargo 进程意味着构建绕过工具链，
  # 且把「仓库处于某个 git 状态」这一隐式依赖塞进运行时。
  - id: no-git-command-in-source
    pattern-regex: '\b(Command::new|Runtime\.getRuntime\(\)\.exec|ProcessBuilder|std::process::Command)\s*\(?\s*"?\s*(git|cargo|gradle|gradlew)\b'
    message: "源码不得调用 git/cargo/gradle。产物由 nix develop 提供；测试语料由 devShell shellHook 取到固定路径。"
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "**/*.rs"
        - "**/*.kt"
        - "**/*.kts"
  # 整条命令行内联进字符串（sh -c "git ..."）同样算。
  - id: no-git-command-string-in-source
    pattern-regex: '(?m)^\s*(git|cargo|gradle|\./gradlew)\s+(clone|checkout|fetch|pull|build|test|install|-{1,2}\w)'
    message: "源码不得内联 git/cargo/gradle 命令行。用 nix develop 提供的工具与 shellHook 取到的语料。"
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "**/*.rs"
        - "**/*.kt"
        - "**/*.kts"
  # ------------------------------------------------------------ git 提交号
  # 40 位十六进制几乎只可能是 sha-1 提交号；英文词不可能凑满 40 个十六进制字符。
  - id: no-git-hash-in-source-and-docs
    pattern-regex: '\b[0-9a-f]{40}\b'
    message: "源码与文档不得出现 git 完整提交号。改用标签、版本号或可解析坐标；提交号随 rebase/force-push 失效且读者无法还原。"
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "**/*.rs"
        - "**/*.kt"
        - "**/*.kts"
        - "**/*.md"
        - "**/*.nu"
        - "**/*.nix"
        - "**/*.yml"
        - "**/*.yaml"
      exclude:
        - "/.semgrep/**"
        - "/docs/specification/*"
        # 归档的变更台账是历史记录本身：那里的提交号就是「当时做了这件事」的证据，
        # 改写它等于伪造记录（台账里已有条目记着某次 force-push 把旧号作废）。
        # 现存全部 114 处集中在此，见汇报。
        - "/openspec/changes/archive/**"
        # docs/STATUS.md 属禁改区：基线行是维护者手写的修订坐标，规则无法靠改文件
        # 满足，故排除；其余任何位置的哈希仍一律拦截。
        - "/docs/STATUS.md"
  # 短提交号：要求至少一位数字且至少一个 a-f 字母，否则纯字母词会被误判
  # （defaced 这类 7 字母词恰好全落在十六进制字符集里）。7~39 位覆盖 git 短号。
  - id: no-git-short-hash-in-source-and-docs
    pattern-regex: '\b(?=[0-9a-f]*[0-9])(?=[0-9a-f]*[a-f])[0-9a-f]{7,39}\b'
    message: "源码与文档不得出现 git 短提交号。改用标签、版本号或可解析坐标。"
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "**/*.rs"
        - "**/*.kt"
        - "**/*.kts"
        - "**/*.md"
        - "**/*.nu"
        - "**/*.nix"
        - "**/*.yml"
        - "**/*.yaml"
      exclude:
        - "/.semgrep/**"
        - "/docs/specification/*"
        # 同上：归档台账里的提交号是历史证据，不追溯改写。
        - "/openspec/changes/archive/**"
        # 同上：STATUS.md 是禁改区，基线坐标由维护者书写，可能取短号。
        - "/docs/STATUS.md"
  # ── 分层与架构：模块方向、错误类型与抑制属性 ──
  - id: no-hardcoded-paths
    pattern-regex: '/data/[a-zA-Z0-9._]+/files'
    paths:
      include:
        - "**/android/app/src/main/**/*.kt"
    message: "No hardcoded /data/.*/files paths in production code — use context.filesDir"
    severity: ERROR
    languages:
      - kotlin
  - id: no-allow-in-prod
    patterns:
      - pattern-regex: '#\[allow\('
    paths:
      include:
        - "**/native/src/**/*.rs"
      exclude:
        - "**/test_helpers*"
        - "**/tests.rs"
        - "**/*_tests.rs"
        - "**/prop_tests.rs"
        - "**/snapshot_test.rs"
    message: "No #[allow] in production source code — fix the underlying issue instead"
    severity: ERROR
    languages:
      - rust
  - id: no-android-in-terminal
    pattern-regex: 'crate::android::'
    paths:
      include:
        - "**/native/src/terminal/**/*.rs"
    message: "terminal module must not depend on android module (violates layer direction)"
    severity: ERROR
    languages:
      - rust
  - id: no-android-in-render
    pattern-regex: 'crate::android::'
    paths:
      include:
        - "**/native/src/render/**/*.rs"
    message: "render module must not depend on android module (violates layer direction)"
    severity: ERROR
    languages:
      - rust
  - id: no-render-in-terminal
    pattern-regex: 'crate::render::'
    paths:
      include:
        - "**/native/src/terminal/**/*.rs"
    message: "terminal module must not depend on render module (violates layer direction)"
    severity: ERROR
    languages:
      - rust
  - id: no-anyhow-in-native
    pattern-regex: '\banyhow\b'
    paths:
      include:
        - "**/native/src/**/*.rs"
    message: "anyhow is forbidden in library crate — use thiserror"
    severity: ERROR
    languages:
      - rust
  # ── Kotlin 代码禁令：跳过测试、协程逃逸、空断言与不受管构建 ──
  - id: no-junit-ignore
    pattern-regex: '@Ignore\b'
    message: "@Ignore hides failures. spec TESTING bans silent skips."
    severity: ERROR
    languages: [kotlin]
  - id: no-junit-assume
    patterns:
      - pattern-either:
          - pattern: Assume.$METHOD(...)
          - pattern: assumeTrue(...)
          - pattern: assumeFalse(...)
          - pattern: assumeThat(...)
    message: "Assume aborts tests silently. Assert preconditions instead."
    severity: ERROR
    languages: [kotlin]
  - id: no-test-early-return
    patterns:
      - pattern: return
      - pattern-inside: |
          @Test
          fun $NAME(...) {
            ...
          }
    message: "bare return in @Test passes vacuously. Use fail(...) instead."
    severity: ERROR
    languages: [kotlin]
  - id: no-globalscope-launch
    patterns:
      - pattern: GlobalScope.launch { ... }
    message: "`GlobalScope.launch` creates a fire-and-forget coroutine with no lifecycle management. Use `viewModelScope`, `lifecycleScope`, or a custom `CoroutineScope` tied to the component lifecycle."
    severity: ERROR
    languages: [kotlin]
    # 无 `fix:`：目标协程作用域随组件而异（viewModelScope / lifecycleScope / 自建），
    # 规则无从判定；此前写的 `$SCOPE.launch { ... }` 里 `$SCOPE` 并未被 pattern 绑定，
    # `semgrep --fix` 会把它替换成空串，直接吃掉整段协程。
  - id: no-runblocking-production
    patterns:
      - pattern: runBlocking { ... }
      - pattern-not-inside: |
          @Test
          fun $F(...) {
            ...
          }
      - pattern-not-inside: |
          @BeforeClass @JvmStatic
          fun $F(...) {
            ...
          }
      - pattern-not: |
          runBlocking {
            withTimeoutOrNull($T) { $B }
          }
      - pattern-not-inside: |
          Thread {
            ...
          }
      - pattern-not-inside: |
          Thread(...)
    message: "`runBlocking` blocks the current thread. Use structured concurrency with `suspend` functions and appropriate scopes."
    severity: ERROR
    languages: [kotlin]
    paths:
      exclude:
        - "**/*/test/*"
        - "**/*/tests/*"
        # 仪器测试与单元测试同为测试代码，测试体里阻塞等待协程是正确用法。
        - "**/*/androidTest/*"
        # onStartCommand has no scope; dedicated daemon-thread bridge.
        - "**/installer/BootstrapInstallService.kt"
  - id: no-non-null-assertion
    patterns:
      - pattern: $VAR!!
    message: "Non-null assertion `!!` throws NullPointerException if the value is null. Use safe calls (`?.`), Elvis (`?:`), or proper null handling."
    severity: ERROR
    languages: [kotlin]
    paths:
      exclude:
        - "**/*/test/*"
        - "**/*/tests/*"
        - "**/*/androidTest/*"
  - id: no-thread-block
    patterns:
      - pattern: thread { ... }
    message: "Raw `thread { }` is discouraged. Use `viewModelScope.launch` or `lifecycleScope.launch` with `Dispatchers.IO` for background work."
    severity: ERROR
    languages: [kotlin]
  - id: no-system-exit
    patterns:
      - pattern: System.exit($ARG)
    message: "`System.exit()` terminates the JVM process. Use proper activity/fragment lifecycle management."
    severity: ERROR
    languages: [kotlin, java]
  - id: no-map-get-nonnull
    patterns:
      - pattern: $MAP.get($KEY)!!
    message: "`.get()!!` throws NullPointerException if the key is missing. Use `$MAP[$KEY] ?: <default>` or `$MAP.getValue($KEY)`."
    severity: WARNING
    languages: [kotlin]
  - id: no-raw-async-callback
    patterns:
      - pattern: |
          object : $CALLBACK {
            ...
          }
      - metavariable-pattern:
          metavariable: $CALLBACK
          pattern: AsyncCallback
    message: "Raw `object : AsyncCallback` blocks the callback style. Use coroutines (`suspend` functions) instead."
    severity: ERROR
    languages: [kotlin]
  - id: no-unmanaged-build-exec
    patterns:
      - pattern-either:
          - pattern: Runtime.getRuntime().exec($CMD, ...)
          - pattern: ProcessBuilder($CMD, ...)
      - metavariable-regex:
          metavariable: $CMD
          regex: '(?i).*(cargo|gradle|assembleDebug).*'
    message: "Unmanaged builds are forbidden; use nix develop tooling."
    severity: ERROR
    languages: [kotlin]
  - id: no-fail-on-no-discovered-tests
    pattern-regex: 'failOnNoDiscoveredTests\s*=\s*false'
    message: "failOnNoDiscoveredTests = false hides empty test discovery."
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "**/*.gradle.kts"
  - id: no-gradle-unmanaged-build
    patterns:
      - pattern: commandLine($ARGS, ...)
      - metavariable-regex:
          metavariable: $ARGS
          regex: '(?s).*(cargo|gradle|assembleDebug).*'
    message: "Unmanaged builds are forbidden in Gradle scripts."
    severity: ERROR
    languages: [kotlin]
    paths:
      include:
        - "**/*.gradle.kts"
  # ── Android 专有：Activity/Context 泄漏与主线程阻塞 ──
  - id: no-activity-static-leak
    patterns:
      - pattern-either:
          - pattern: |
              companion object {
                ...
                var $FIELD: $ACTIVITY = ...
                ...
              }
          - pattern: |
              object $OBJECT {
                ...
                var $FIELD: $ACTIVITY = ...
                ...
              }
      - metavariable-regex:
          metavariable: $ACTIVITY
          regex: '.*Activity'
    message: "Storing an Activity reference in a companion/object leaks the Activity. Use `WeakReference<Activity>` or a lifecycle-aware pattern."
    severity: ERROR
    languages: [kotlin]
  - id: no-basecontext-stored
    patterns:
      - pattern-either:
          - pattern: |
              companion object {
                ...
                var $FIELD = $CTX.getBaseContext()
                ...
              }
          - pattern: |
              object $OBJECT {
                ...
                var $FIELD = $CTX.getBaseContext()
                ...
              }
          - pattern: |
              companion object {
                ...
                var $FIELD = $CTX.baseContext
                ...
              }
          - pattern: |
              object $OBJECT {
                ...
                var $FIELD = $CTX.baseContext
                ...
              }
