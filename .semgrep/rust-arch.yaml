rules:
  - id: no-hardcoded-paths
    pattern-regex: '/data/[a-zA-Z0-9._]+/files'
    paths:
      include:
        - "**/android/app/src/main/**/*.kt"
    message: "No hardcoded /data/.*/files paths in production code — use context.filesDir"
    severity: ERROR
    languages:
      - kotlin

  - id: no-allow-in-prod
    patterns:
      - pattern-regex: '#\[allow\('
      - pattern-not-inside: '#[cfg(test)]'
    paths:
      include:
        - "**/native/src/**/*.rs"
      exclude:
        - "**/test_helpers*"
    message: "No #[allow] in production source code — fix the underlying issue instead"
    severity: ERROR
    languages:
      - rust

  - id: no-android-in-terminal
    pattern-regex: 'crate::android::'
    paths:
      include:
        - "**/native/src/terminal/**/*.rs"
    message: "terminal module must not depend on android module (violates layer direction)"
    severity: ERROR
    languages:
      - rust

  - id: no-android-in-render
    pattern-regex: 'crate::android::'
    paths:
      include:
        - "**/native/src/render/**/*.rs"
    message: "render module must not depend on android module (violates layer direction)"
    severity: ERROR
    languages:
      - rust

  - id: no-render-in-terminal
    pattern-regex: 'crate::render::'
    paths:
      include:
        - "**/native/src/terminal/**/*.rs"
    message: "terminal module must not depend on render module (violates layer direction)"
    severity: ERROR
    languages:
      - rust

  - id: no-anyhow-in-native
    pattern-regex: '\banyhow\b'
    paths:
      include:
        - "**/native/src/**/*.rs"
    message: "anyhow is forbidden in library crate — use thiserror"
    severity: ERROR
    languages:
      - rust
