    api: []
    tests:
      - "android/app/src/test/java/terminal/emulator/ui/TextSearchBarDebounceTest.kt"
    verification: "cd android && ./gradlew testDebugUnitTest"

  FR-058:
    description: "Dependent settings controls SHALL be grayed out (disabled) when their prerequisite is off — cursor-speed slider when cursor blink is off, user-theme edit entry when no user themes exist."
    design:
      - "android/app/src/main/java/terminal/emulator/ui/SettingsScreen.kt"
      - "android/app/src/main/java/terminal/emulator/ui/SettingsComponents.kt"
    api: []
    tests: []
    verification: "cd android && ./gradlew spotlessCheck detekt"

  FR-059:
    description: "The terminal surface SHALL expose accessibility custom actions (read previous line, read next line, read all) and update its content description to the current screen text (throttled) so TalkBack can navigate terminal content line by line."
    design:
      - "android/app/src/main/java/terminal/emulator/ui/TerminalSurface.kt"
    api: []
    tests: []
    verification: "Emulator check with TalkBack event log"

  FR-060:
    description: "The bootstrap installer SHALL support HTTP download (existing ensureBootstrap(url)) and local-file install via SAF (existing offline install button), both installing through BootstrapInstaller.install + SecondStageRunner.run. Embedded assets/bootstrap/ archives SHALL NOT be added — the APK must not carry the archive."
    design:
      - "android/app/src/main/java/terminal/emulator/installer/BootstrapOrchestrator.kt"
      - "android/app/src/main/java/terminal/emulator/installer/BootstrapInstaller.kt"
    api: []
    tests: []
    verification: "cd android && ./gradlew spotlessCheck detekt"

  FR-061:
    description: "Toolbar keys SHALL support a width (flex weight) and an optional secondary key (long-press action); the layout editor SHALL allow editing both; serialization SHALL be backward compatible with existing layouts."
    design:
      - "android/app/src/main/java/terminal/emulator/ui/ToolbarPreferences.kt"
      - "android/app/src/main/java/terminal/emulator/ui/ModifierBar.kt"
    api: []
    tests:
      - "android/app/src/test/java/terminal/emulator/ui/ToolbarPreferencesTest.kt"
    verification: "cd android && ./gradlew testDebugUnitTest"

  FR-062:
    description: "PlatformCapabilities SHALL expose Memory and Unsupported capability variants so callers can distinguish a memory-limited device from an unsupported configuration without panicking."
    design:
      - "native/src/platform/capabilities.rs"
    api: []
    tests:
      - "native/src/platform/capabilities.rs"
    verification: "cargo test --package native"

  FR-063:
    description: "Terminal surface URL detection SHALL route through the scroll-position LRU cache (UrlCache.getOrCompute) so repeated queries at the same scroll offset reuse cached results."
    design:
      - "android/app/src/main/java/terminal/emulator/ui/UrlCache.kt"
    api: []
    tests:
      - "android/app/src/test/java/terminal/emulator/ui/UrlCacheTest.kt"
    verification: "cd android && ./gradlew testDebugUnitTest"

  # ==========================================================================
  # 4.1 Safety (NFR-001 — NFR-005)
  # ==========================================================================

  NFR-001:
    description: "native crate SHALL contain zero unsafe blocks in the terminal module. The build MUST fail if cargo geiger --package native reports any unsafe usage."
    design:
      - "docs/architecture.md#52-module-responsibilities"
      - "docs/architecture.md#81-error-handling"
    api: []
    tests:
      - "integration-tests/tests/tool_lint.rs"
    verification: "cargo geiger --package native"

  NFR-002:
    description: "All unsafe blocks in the codebase SHALL be preceded by a // SAFETY: comment explaining the invariants."
    design:
      - "docs/architecture.md#81-error-handling"
    api: []
    tests:
      - "integration-tests/tests/tool_lint.rs"
    verification: "cargo geiger --all"

  NFR-003:
    description: "The system SHALL not panic in error paths. Library functions SHALL return Result or Option rather than panicking."
    design:
      - "docs/architecture.md#81-error-handling"
    api: []
    tests:
      - "integration-tests/tests/tool_lint.rs"
    verification: "cargo test --workspace"

  NFR-004:
    description: "The system SHALL use thiserror 2 (not anyhow) for error types in library crates."
    design:
      - "docs/architecture.md#81-error-handling"
    api: []
    tests:
      - "integration-tests/tests/tool_lint.rs"
    verification: "cargo test --workspace"

  NFR-005:
    description: "The system SHALL handle thread panics gracefully: the PTY reader thread, process waiter thread, and render thread SHALL NOT bring down the entire process on panic."
    design:
      - "docs/architecture.md#63-thread-model"
      - "docs/architecture.md#81-error-handling"
      - "native/src/terminal/session.rs"
    api: []
    tests:
      - "native/src/terminal/session.rs"
    verification: "cargo test --package native"

  # ==========================================================================
  # 4.2 Performance (NFR-006 — NFR-011)
  # ==========================================================================

  NFR-006:
    description: "The render thread SHALL use wgpu (Vulkan) for GPU-accelerated rendering. Software rendering via CPU text drawing (Canvas.drawText) is forbidden."
    design:
      - "docs/architecture.md#9-architecture-decisions"
      - "docs/architecture.md#51-crate-structure"
    api: []
    tests:
      - "native/src/render/tests.rs"
      - "native/src/render/screenshot_tests.rs"
    verification: "cargo test --package native"

  NFR-007:
    description: "The glyph atlas SHALL be managed by guillotiere with a cache capacity of at least 10,000 glyph entries and eviction when full."
    design:
      - "docs/architecture.md#52-module-responsibilities"
      - "native/src/render/font/atlas.rs"
    api: []
    tests:
      - "native/src/render/font/mod.rs"
    verification: "cargo test --package native"

  NFR-008:
    description: "The scrollback buffer SHALL be bounded to a configurable maximum (default 50,000 lines) with automatic eviction of oldest entries. SHALL NOT exhibit unbounded memory growth."
    design:
      - "docs/architecture.md#52-module-responsibilities"
      - "native/src/terminal/ghostty_terminal/internal.rs"
    api: []
    tests:
      - "native/src/terminal/ghostty_terminal/tests.rs"
    verification: "cargo test --package native"

  NFR-009:
    description: "Each terminal session SHALL use a bounded number of threads (4 per session: PTY reader, input writer, process waiter, render thread) plus shared threads (MCP listener)."
    design:
      - "docs/architecture.md#63-thread-model"
    api: []
    tests:
      - "native/src/terminal/session.rs"
    verification: "cargo test --package native"

  NFR-010:
    description: "The frame pipeline SHALL only repaint dirty rows as tracked by the DirtyMask bitfield, avoiding full-grid redraws on every frame."
    design:
      - "docs/architecture.md#61-render-path-fast-path"
      - "native/src/render/cell_builder.rs"
    api: []
    tests:
      - "native/src/render/tests.rs"
    verification: "cargo test --package native"

  NFR-011:
    description: "The shaped text cache SHALL be capped at 4,096 entries to avoid unbounded memory growth from repeated shaping of different text runs."
    design:
      - "docs/architecture.md#52-module-responsibilities"
      - "native/src/render/font/mod.rs"
    api: []
    tests:
      - "native/src/render/font/mod.rs"
    verification: "cargo test --package native"

  # ==========================================================================
  # 4.3 Maintainability (NFR-012 — NFR-016)
  # ==========================================================================

  NFR-012:
    description: "The crate dependency graph SHALL be strictly one-way with no circular dependencies. The build SHALL fail on cycle detection."
    design:
      - "docs/architecture.md#53-dependency-graph"
    api: []
    tests:
      - "integration-tests/tests/tool_lint.rs"
    verification: "cargo test --workspace"

  NFR-013:
    description: "The codebase SHALL pass cargo clippy --all -- --deny warnings with zero warnings. No #[allow] attributes in production source code."
    design:
      - "docs/architecture.md#appendix-testing-quick-reference"
    api: []
    tests:
      - "integration-tests/tests/tool_lint.rs"
    verification: "cargo clippy --all -- --deny warnings"

  NFR-014:
    description: "The codebase SHALL pass cargo fmt --check with consistent formatting."
    design:
      - "docs/architecture.md#appendix-testing-quick-reference"
    api: []
    tests:
      - "integration-tests/tests/tool_lint.rs"
    verification: "cargo fmt --check"

  NFR-015:
    description: "The Kotlin codebase SHALL pass ./gradlew spotlessCheck detekt with zero violations."
    design: []
    api: []
    tests:
      - "android/app/src/main/java/terminal/emulator/"
    verification: "cd android && ./gradlew spotlessCheck detekt"

  NFR-016:
    description: "When native terminal types change, the JNI bridge in native/src/android/ffi.rs and NativeBridge.kt SHALL be updated correspondingly."
    design:
      - "docs/architecture.md#52-module-responsibilities"
      - "docs/architecture.md#9-architecture-decisions"
    api: []
    tests:
      - "native/src/android/ffi.rs"
    verification: "cargo test --package native"

  # ==========================================================================
  # 4.4 Compatibility (NFR-017 — NFR-021)
  # ==========================================================================

  NFR-017:
    description: "The system SHALL target Android as the primary platform, using Kotlin + Compose for the UI layer."
    design:
      - "docs/architecture.md#51-crate-structure"
    api: []
    tests:
      - "android/app/src/androidTest/java/terminal/emulator/ui/*.kt"
    verification: "cd android && ./gradlew assembleDebug"

  NFR-018:
    description: "The system SHALL use Vulkan via wgpu for rendering. On systems without a physical GPU, Mesa's Lavapipe (software Vulkan) SHALL be used. On Android emulators, SwiftShader SHALL be used."
    design:
      - "docs/architecture.md#9-architecture-decisions"
    api: []
    tests:
      - "native/src/render/tests.rs"
    verification: "cargo test --package native"

  NFR-019:
    description: "The build SHALL be deterministic via Nix flake, pinning all dependencies including the Zig compiler (for Ghostty), Rust toolchain, and Android SDK."
    design:
      - "docs/architecture.md#9-architecture-decisions"
    api: []
    tests:
      - "flake.nix"
    verification: "nix flake check"

  NFR-020:
    description: "The Ghostty library (libghostty-vt) SHALL be linked as a dynamic library (dylib) with the SONAME versioned suffix stripped for Android compatibility."
    design:
      - "docs/architecture.md#9-architecture-decisions"
    api: []
    tests:
      - "native/Cargo.toml"
    verification: "nu scripts/check-rust.nu"

  NFR-021:
    description: "The APK SHALL use the application ID com.termux and SHALL be signed with the AOSP testkey (not self-signed certificates)."
    design: []
    api: []
    tests:
      - "android/app/build.gradle.kts"
    verification: "cd android && ./gradlew assembleDebug"

  # ==========================================================================
  # 4.5 Reliability (NFR-022 — NFR-024)
  # ==========================================================================

  NFR-022:
    description: "The render thread SHALL detect GPU surface loss and recreate the wgpu pipeline automatically. After 100 consecutive errors (~10 seconds), the thread SHALL exit permanently and require a new surface to restart."
    design:
      - "docs/architecture.md#81-error-handling"
      - "native/src/render/context.rs"
    api: []
    tests:
      - "native/src/render/tests.rs"
    verification: "cargo test --package native"

  NFR-023:
    description: "The OSC handler SHALL cap payload size at 1 MB (MAX_PAYLOAD_BYTES) to prevent denial-of-service via oversized OSC sequences."
    design:
      - "native/src/terminal/osc_handler.rs"
    api: []
    tests:
      - "native/src/terminal/osc_handler.rs"
    verification: "cargo test --package native"

  NFR-024:
    description: "The system SHALL recover from PTY read errors without crashing the session. The reader thread SHALL log errors and continue reading."
    design:
      - "docs/architecture.md#81-error-handling"
      - "native/src/terminal/session.rs"
    api: []
    tests:
      - "native/src/terminal/session.rs"
    verification: "cargo test --package native"

  # 4.6 Infrastructure (NFR-025)
  # ==========================================================================

  NFR-025:
    description: "The system SHALL provide unified logging infrastructure that writes to both logcat and a rotating file, with log levels configurable independently for each output."
    design:
      - "native/src/android/logging.rs"
    api: []
    tests:
      - "native/src/android/logging.rs"
    verification: "ls native/src/android/logging.rs"

