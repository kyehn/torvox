# 仅收录与 detekt 默认配置的差异项（buildUponDefaultConfig=true 会继承其余全部默认）。
# 不要回填默认条目；必要抑制见 STYLE.md，需附理由。
config:
  warningsAsErrors: true
comments:
  DeprecatedBlockTag:
    active: true
complexity:
  CognitiveComplexMethod:
    active: true
    threshold: 30
  ComplexCondition:
    threshold: 12
  CyclomaticComplexMethod:
    threshold: 20
  LargeClass:
    threshold: 1600
  LongMethod:
    threshold: 80
  LongParameterList:
    functionThreshold: 10
    constructorThreshold: 9
    ignoreDefaultParameters: true
  NestedBlockDepth:
    threshold: 5
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 15
    thresholdInInterfaces: 15
    thresholdInObjects: 15
    thresholdInEnums: 15
    ignoreDeprecated: true
    ignoreAnnotatedFunctions: ['Composable']
empty-blocks:
  EmptyFunctionBlock:
    ignoreOverridden: true
exceptions:
  # 规范要求捕获后记录并继续或崩溃退出，与这三条冲突，故关闭。
  InstanceOfCheckForException:
    active: false
  SwallowedException:
    active: false
  TooGenericExceptionCaught:
    active: false
  TooGenericExceptionThrown:
    active: false
naming:
  ConstructorParameterNaming:
    active: false
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  FunctionParameterNaming:
    active: false
potential-bugs:
  LateinitUsage:
    active: true
  MissingPackageDeclaration:
    active: true
style:
  CanBeNonNullable:
    active: true
  CollapsibleIfStatements:
    active: true
  LoopWithTooManyJumpStatements:
    active: false
  MagicNumber:
    active: false
  MandatoryBracesLoops:
    active: true
  MaxLineLength:
    active: false
  NoTabs:
    active: true
  RedundantExplicitType:
    active: true
  ReturnCount:
    active: false
  SpacingBetweenPackageAndImports:
    active: true
  ThrowsCount:
    active: false
  TrailingWhitespace:
    active: true
  UnnecessaryBracesAroundTrailingLambda:
    active: true
  UnnecessaryLet:
    active: true
  UnusedImports:
    active: true
  UnusedParameter:
    active: false
  UseDataClass:
    active: true
