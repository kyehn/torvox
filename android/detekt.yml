config:
  warningsAsErrors: true
comments:
  DeprecatedBlockTag:
    active: true
complexity:
  CognitiveComplexMethod:
    active: false
  ComplexCondition:
    allowedConditions: 12
  CyclomaticComplexMethod:
    active: false
  LargeClass:
    allowedLines: 1600
  LongMethod:
    active: false
  LongParameterList:
    active: false
  NestedBlockDepth:
    active: false
  TooManyFunctions:
    active: false
empty-blocks:
  EmptyFunctionBlock:
    ignoreOverridden: true
exceptions:
  InstanceOfCheckForException:
    active: false
  SwallowedException:
    active: false
  TooGenericExceptionCaught:
    active: false
  TooGenericExceptionThrown:
    active: false
libraries:
  ForbiddenPublicDataClass:
    active: false
  LibraryEntitiesShouldNotBePublic:
    active: false
naming:
  ConstructorParameterNaming:
    active: false
  FunctionNaming:
    ignoreAnnotated: ['Composable']
potential-bugs:
  LateinitUsage:
    active: true
  MissingPackageDeclaration:
    active: true
style:
  CanBeNonNullable:
    active: true
  CollapsibleIfStatements:
    active: true
  LoopWithTooManyJumpStatements:
    active: false # 有界排空循环依赖 break/continue。
  MagicNumber:
    active: false # 计时/硬件常量均已内联标注单位。
  MandatoryBracesLoops:
    active: true
  MaxLineLength:
    active: false # 中文注释与 URL 无法按列宽换行。
  NoTabs:
    active: true
  RedundantExplicitType:
    active: true
  ReturnCount:
    active: false
  SpacingAfterPackageAndImports:
    active: true
  ThrowsCount:
    active: false
  TrailingWhitespace:
    active: true
  UnnecessaryBracesAroundTrailingLambda:
    active: true
  UnnecessaryLet:
    active: true
  UnusedImport:
    active: true
  UnusedParameter:
    active: false
  UseDataClass:
    active: true
