# 仅收录与 detekt 默认配置的差异项（buildUponDefaultConfig=true 会继承其余全部默认）。
# 不要回填默认条目；必要抑制见 STYLE.md，需附理由。
config:
  warningsAsErrors: true
comments:
  DeprecatedBlockTag:
    active: true
complexity:
  # 规范允许抑制参数数量/行数/嵌套层数类规则。
  CognitiveComplexMethod:
    active: false
  ComplexCondition:
    threshold: 12
  CyclomaticComplexMethod:
    active: false
  LargeClass:
    threshold: 1600
  LongMethod:
    active: false
  LongParameterList:
    active: false
  NestedBlockDepth:
    active: false
  TooManyFunctions:
    active: false
empty-blocks:
  EmptyFunctionBlock:
    ignoreOverridden: true
exceptions:
  # 规范要求捕获后记录并继续或崩溃退出，与这几条冲突，故关闭。
  InstanceOfCheckForException:
    active: false
  SwallowedException:
    active: false
  TooGenericExceptionCaught:
    active: false
  TooGenericExceptionThrown:
    active: false
naming:
  ConstructorParameterNaming:
    active: false #  wire 格式兼容（JSON/原生 snake_case），不可改名。
  FunctionNaming:
    ignoreAnnotated: ['Composable']
potential-bugs:
  LateinitUsage:
    active: true
  MissingPackageDeclaration:
    active: true
style:
  CanBeNonNullable:
    active: true
  CollapsibleIfStatements:
    active: true
  LoopWithTooManyJumpStatements:
    active: false # 有界排空循环依赖 break/continue。
  MagicNumber:
    active: false # 计时/硬件常量均已内联标注单位。
  MandatoryBracesLoops:
    active: true
  MaxLineLength:
    active: false # 中文注释与 URL 无法按列宽换行。
  NoTabs:
    active: true
  RedundantExplicitType:
    active: true
  ReturnCount:
    active: false # 卫语句风格与之冲突。
  SpacingBetweenPackageAndImports:
    active: true
  ThrowsCount:
    active: false # 入口显式抛错，规范要求尽早报错。
  TrailingWhitespace:
    active: true
  UnnecessaryBracesAroundTrailingLambda:
    active: true
  UnnecessaryLet:
    active: true
  UnusedImports:
    active: true
  UnusedParameter:
    active: false # 测试桩必须镜像安卓 API 签名。
  UseDataClass:
    active: true
