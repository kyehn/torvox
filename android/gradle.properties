org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=false
# BUILD.md 规定 minSdk=33 高于 targetSdk=28（规避旧版行为变更），AGP 会就此告警；
# 变更是刻意的，抑制以保持检查输出零警告。AGP 视该抑制项本身为实验性，一并列出。
android.sync.suppressAgpWarnings=MIN_SDK_VERSION_GREATER_THAN_TARGET_SDK,UNSUPPORTED_PROJECT_OPTION_USE
