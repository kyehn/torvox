name: check
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@main
      - uses: actions/checkout@main
        with:
          repository: ${{ github.actor }}/kudzu
          path: result-kudzu
      # 与 build.yml 同因：镜像预装的 dotnet/ghc/boost/ghcup/mono 用不到，而 nix
      # 闭包解包需要数 GB——不回收就把根分区吃满，install-nix 阶段 ENOSPC
      # （CI 实录：copying path ... No space left on device）。
      - name: 释放 runner 磁盘
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/.ghcup /usr/lib/mono
          sudo apt-get clean
          sudo docker image prune --all --force || true
          df -h /
      - uses: ./result-kudzu/.github/actions/install-nix
      - uses: cachix/cachix-action@master
        continue-on-error: true
        with:
          name: ${{ secrets.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: actions/cache/restore@main
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/build-cache-1
            ~/.gradle/caches/*/kotlin-dsl
            ~/.gradle/caches/*/javaCompile
            ~/.gradle/caches/*/transforms
            ~/.gradle/wrapper/dists
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git
            native/target/
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-
      - env:
          CARGO_INCREMENTAL: "0"
        run: scripts/check.nu
      - uses: actions/cache/save@main
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/build-cache-1
            ~/.gradle/caches/*/kotlin-dsl
            ~/.gradle/caches/*/javaCompile
            ~/.gradle/caches/*/transforms
            ~/.gradle/wrapper/dists
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git
            native/target/
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
