name: build
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@main
      - uses: actions/checkout@main
        with:
          repository: ${{ github.actor }}/kudzu
          path: result-kudzu
      # ubuntu-26.04 镜像上 `install-nix` 自带的清理步骤全部 skipped（日志里三个
      # rm 步骤结论均为 skipped），于是「4.7GB 缓存 + nix 闭包」把根分区吃满，
      # 闭包解包时 write 直接 ENOSPC。这里显式回收与本次构建无关的预装工具链：
      # dotnet/ghc/boost/ghcup/mono 都用不到，Android SDK（含 NDK）与系统镜像
      # 必须保留——构建与模拟器步骤都依赖它们。
      - name: 释放 runner 磁盘
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/.ghcup /usr/lib/mono
          sudo apt-get clean
          sudo docker image prune --all --force || true
          df -h /
      - uses: ./result-kudzu/.github/actions/install-nix
      - uses: cachix/cachix-action@master
        continue-on-error: true
        with:
          name: ${{ secrets.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: actions/cache/restore@main
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/build-cache-1
            ~/.gradle/caches/*/kotlin-dsl
            ~/.gradle/caches/*/javaCompile
            ~/.gradle/caches/*/transforms
            ~/.gradle/wrapper/dists
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git
            native/target/
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-
      - run: |
          scripts/build-android-libs.nu arm64-v8a x86_64
          scripts/build-apk.nu --release
      - uses: actions/upload-artifact@main
        with:
          name: release-apk
          path: android/app/build/outputs/apk/release/*.apk
          archive: false
      - id: build_debug_apk
        run: scripts/build-apk.nu --debug
      - uses: actions/upload-artifact@main
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          archive: false
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          # API 35 系统自身占用高；1.5G 时 warmStart 十轮后内存压力累积，
          # coldStart 阶段 adbd 直接掉线（CI 实录 device offline），3G 保证宏基准完整跑完。
          ram-size: 3072M
          emulator-boot-timeout: 600
          cores: 2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            set -e
            nix develop --command nu ${{ github.workspace }}/scripts/test-emulator.nu
      - run: |
          git tag --force 0.1.0
          git push origin 0.1.0 --force
          scripts/build-apk.nu --release
      - uses: softprops/action-gh-release@master
        with:
          tag_name: 0.1.0
          generate_release_notes: false
          files: android/app/build/outputs/apk/release/*.apk
      - if: ${{ always() && steps.build_debug_apk.outcome == 'success' }}
        uses: actions/cache/save@main
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/build-cache-1
            ~/.gradle/caches/*/kotlin-dsl
            ~/.gradle/caches/*/javaCompile
            ~/.gradle/caches/*/transforms
            ~/.gradle/wrapper/dists
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git
            native/target/
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
