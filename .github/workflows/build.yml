name: build
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'release'
        required: false
        default: false
        type: boolean
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - run: sudo rm --recursive --force /opt/hostedtoolcache /opt/google /opt/microsoft /var/lib/docker /snap /var/lib/snapd /usr/lib/snapd /usr/share/doc /usr/share/man /usr/share/info
      - uses: actions/checkout@main
      - uses: actions/checkout@main
        with:
          repository: ${{ github.actor }}/kudzu
          path: result-kudzu
      - uses: ./result-kudzu/.github/actions/install-nix
      - uses: cachix/cachix-action@master
        continue-on-error: true
        with:
          name: ${{ secrets.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: actions/cache/restore@main
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/build-cache-1
            ~/.gradle/caches/*/kotlin-dsl
            ~/.gradle/caches/*/javaCompile
            ~/.gradle/caches/*/transforms
            ~/.gradle/wrapper/dists
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git
            native/target/
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-
      - run: |
          scripts/build-android-libs.nu arm64-v8a x86_64
          scripts/build-apk.nu --release
      - uses: actions/upload-artifact@main
        with:
          name: release-apk
          path: android/app/build/outputs/apk/release/*.apk
          archive: false
      - id: build_debug_apk
        run: scripts/build-apk.nu --debug
      - uses: actions/upload-artifact@main
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          archive: false
      - run: scripts/build-apk.nu --nix
      - uses: actions/upload-artifact@main
        with:
          name: nix-apk
          path: android/app/build/outputs/apk/nix/*.apk
          archive: false
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 3072M
          emulator-boot-timeout: 600
          cores: 2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            set -e
            nix develop --command nu ${{ github.workspace }}/scripts/test-emulator.nu
      - if: ${{ inputs.release }}
        run: |
          git tag --force 0.1.0
          git push origin 0.1.0 --force
          scripts/build-apk.nu --release
      - if: ${{ inputs.release }}
        uses: softprops/action-gh-release@master
        with:
          tag_name: 0.1.0
          generate_release_notes: false
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/nix/*.apk
      - run: rm -rf native/target ~/.cargo ~/.gradle
      - if: ${{ always() && steps.build_debug_apk.outcome == 'success' }}
        uses: actions/cache/save@main
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/build-cache-1
            ~/.gradle/caches/*/kotlin-dsl
            ~/.gradle/caches/*/javaCompile
            ~/.gradle/caches/*/transforms
            ~/.gradle/wrapper/dists
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git
            native/target/
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
