appId: com.termux
name: "Regression  #9/#12/#13: long-press menu four factors"
tags:
  - e2e
  - regression
---
- launchApp:
    clearState: false
    stopApp: true
- waitForAnimationToEnd:
    timeout: 20000
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible:
      id: "TerminalScreen"
    timeout: 30000
# Factor ①② — long press on TEXT expands to word selection + full menu
- longPressOn:
    id: "TerminalContent"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: regress-longpress-text-menu-full
# Dismiss
- pressKey: Back
- waitForAnimationToEnd:
    timeout: 1000
# Factor ③④ — drag handle hides menu; release restores it. Edge scroll and
# paste-only blank behavior are asserted via screenshots + uiautomator dump
# in the same verification session.
- takeScreenshot: regress-longpress-dismissed
