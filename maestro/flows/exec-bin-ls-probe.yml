appId: com.termux
name: exec-bin bin listing probe
tags:
  - nix
---
# Failsafe session MUST be started via the setup channel before this flow:
#   adb shell am start -n com.termux/terminal.emulator.MainActivity
#     -a android.intent.action.RUN
#     --ez com.termux.app.failsafe_session true
# Real terminal input only; adb is setup/screenshot-readback, never validation.
- extendedWaitUntil:
    visible:
      id: "TerminalScreen"
    timeout: 15000
- tapOn:
    id: "TerminalContent"
- waitForAnimationToEnd:
    timeout: 3000
- inputText: "ls /data/data/com.termux/files/usr/bin/; echo LS-RC=$?"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: exec_ls_bin
