appId: com.termux
name: Shizuku toggle visible and off
tags:
  - smoke
  - shizuku
---
- launchApp:
    clearState: true
    stopApp: true
- waitForAnimationToEnd:
    timeout: 20000
- tapOn:
    text: "Wait"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "TerminalScreen"
    timeout: 30000
- tapOn:
    id: "Key_DRAWER"
- extendedWaitUntil:
    visible:
      id: "SessionDrawer"
    timeout: 15000
- tapOn:
    id: "SettingsButton"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "SettingsScreen"
- scrollUntilVisible:
    element:
      id: "ShizukuToggle"
    direction: DOWN
- assertVisible:
    id: "ShizukuToggle"
- takeScreenshot: shizuku_toggle_off
