appId: com.termux
name: Session management verification
tags:
  - e2e
  - p1
---
- launchApp:
    clearState: true
    stopApp: true
- waitForAnimationToEnd:
    timeout: 20000
- tapOn:
    text: "Wait"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "TerminalScreen"
    timeout: 30000
- assertVisible:
    id: "TerminalScreen"
- assertVisible:
    id: "ModifierBar"
# Open session drawer (tap, not swipe: an edge swipe from 3% is
# intercepted by the system back-gesture on gesture-nav devices)
- tapOn:
    id: "Key_DRAWER"
- extendedWaitUntil:
    visible:
      id: "SessionDrawer"
    timeout: 15000
- assertVisible:
    id: "SessionDrawer"
- assertVisible:
    id: "AddSessionButton"
- takeScreenshot: session_drawer_default
# 用返回键关闭抽屉（产品支持的 dismiss 路径，TerminalScreen BackHandler）：
# 原先按坐标点外部关闭，抽屉宽 280dp，在小屏设备上 70% 落点可能仍在抽屉内，
# 点到会话项导致抽屉未关闭，后续断言 flaky。
- pressKey: Back
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    id: "TerminalScreen"
- takeScreenshot: session_drawer_closed
