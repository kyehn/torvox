appId: com.termux
name: Session management verification
tags:
  - e2e
  - p1
---
- launchApp:
    clearState: true
    stopApp: true
- waitForAnimationToEnd:
    timeout: 20000
- tapOn:
    text: "Wait"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "TerminalScreen"
    timeout: 30000
- assertVisible:
    id: "TerminalScreen"
- assertVisible:
    id: "ModifierBar"
# Open session drawer (tap, not swipe: an edge swipe from 3% is
# intercepted by the system back-gesture on gesture-nav devices)
- tapOn:
    id: "Key_DRAWER"
- extendedWaitUntil:
    visible:
      id: "SessionDrawer"
    timeout: 15000
- assertVisible:
    id: "SessionDrawer"
- assertVisible:
    id: "AddSessionButton"
- takeScreenshot: session_drawer_default
# Close drawer by tapping outside
- tapOn:
    point: 70%,50%
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    id: "TerminalScreen"
- takeScreenshot: session_drawer_closed
