appId: com.termux
name: Bootstrap picker search continuation
tags:
  - nix
---
# Continuation: the system file picker is already open on Recent
# (prior flow tapped the offline button and opened it). No relaunch:
# use the picker search to find the staged zip deterministically.
- tapOn: "Search"
- inputText: "nix-bootstrap-x86_64.zip"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: pick_search_result
- tapOn: "nix-bootstrap-x86_64.zip"
