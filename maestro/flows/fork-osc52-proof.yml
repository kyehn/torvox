appId: com.termux
name: OSC52 clipboard proof
tags:
  - nix
---
# Proof that OSC 52 clipboard works end to end, without relying on
# GPU-surface capture (uncapturable on this emulator):
# 1. Real terminal input runs nix --version (proves the session is alive).
# 2. The shell pushes a KNOWN-SAFE single-line marker to the Android
#    clipboard via OSC 52 (Ghostty ClipboardEvent -> setClipboardText).
#    Single line with no newline, so pasting it back cannot execute anything.
# 3. The marker is pasted back into the terminal (Maestro pasteText) and
#    screenshotted sitting in the input line. Screenshot is the assertion:
#    terminal text lives on a GPU canvas, invisible to the view hierarchy.
- launchApp:
    stopApp: true
- waitForAnimationToEnd:
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "TerminalScreen"
    timeout: 30000
- assertVisible:
    id: "TerminalScreen"
- tapOn:
    id: "TerminalContent"
- waitForAnimationToEnd:
    timeout: 20000
- inputText: "nix --version"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 15000
- inputText: "printf '\\e]52;c;%s\\a' \"$(echo -n OSC52_ALIVE|base64 -w0)\""
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 5000
- inputText: "echo CLIPBOARD-SENT"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 10000
- pressKey: Back
- waitForAnimationToEnd:
    timeout: 3000
# Focus the prompt and paste the marker back; it lands as input text
# (no newline in the payload, so nothing executes).
- tapOn:
    id: "TerminalContent"
- waitForAnimationToEnd:
    timeout: 2000
- pasteText
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: osc52_proof
