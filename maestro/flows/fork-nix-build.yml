appId: com.termux
name: Fork nix build via real terminal input
tags:
  - nix
---
# Continues the live fork-login session: builds a trivial derivation.
# No launchApp (keeps the existing session). Readback via DUMP_TERMINAL.
- tapOn:
    id: "TerminalContent"
- waitForAnimationToEnd:
    timeout: 3000
- inputText: "nix --option build-users-group \"\" build --impure --expr 'builtins.derivation {name=\"t\"; system=\"x86_64-linux\"; builder=\"/bin/sh\"; args=[\"-c\" \"echo ok > $out\"];}' --print-out-paths"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 60000
- takeScreenshot: fork_nix_build
