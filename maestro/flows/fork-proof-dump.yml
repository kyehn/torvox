appId: com.termux
name: Fork proof via DUMP_TERMINAL
tags:
  - nix
---
# DUMP_TERMINAL prints terminal buffer to logcat, then we read it via adb logcat
# (adb used only for reading output, not for executing terminal commands)

- extendedWaitUntil:
    visible:
      id: "TerminalScreen"
    timeout: 15000

- tapOn:
    id: "TerminalContent"

- waitForAnimationToEnd:
    timeout: 3000

# Step 1: nix --version
- inputText: "nix --version"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 20000
- takeScreenshot: proof_dump_01

- tapOn:
    id: "TerminalContent"
# Step 2: nix build  
- inputText: "nix --option build-users-group \"\" build --impure --expr 'builtins.derivation {name=\"t\"; system=\"x86_64-linux\"; builder=\"/bin/sh\"; args=[\"-c\" \"echo ok > $out\"];}' --print-out-paths"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 60000
- takeScreenshot: proof_dump_02

- tapOn:
    id: "TerminalContent"
# Step 3: cat the output
- inputText: "cat /nix/store/d45cdcwji3axn5bdvf1f3mqhja89mycw-t"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: proof_dump_03
