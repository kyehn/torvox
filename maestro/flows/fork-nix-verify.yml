appId: com.termux
name: Fork Go-login nix verification (real terminal input)
tags:
  - nix
---
# Verifies the kyehn/nix-on-droid fork bootstrap through the Shizuku
# rish bridge using ONLY real terminal input. Assumes the fork bootstrap
# is already installed and the Shizuku switch is on. Readback is done
# outside Maestro via the DUMP_TERMINAL backdoor (text, not screenshots).
- launchApp:
    stopApp: true
- waitForAnimationToEnd:
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "TerminalScreen"
    timeout: 30000
- assertVisible:
    id: "TerminalScreen"
- tapOn:
    id: "TerminalContent"
- waitForAnimationToEnd:
    timeout: 15000
- inputText: "nix --version"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: fork_nix_version
