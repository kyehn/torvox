appId: com.termux
name: Dismiss system ANR and settle
tags:
  - nix
---
# The emulator shows a transient "System UI isn't responding" ANR
# under load (fresh boot + background build). Dismiss it so the
# install flow can proceed. All steps optional: a settled device
# simply skips through.
- tapOn:
    text: "Wait"
    optional: true
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    text: "Close app"
    optional: true
- waitForAnimationToEnd:
    timeout: 15000
