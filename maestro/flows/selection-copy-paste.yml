appId: com.termux
name: Selection copy and paste
tags:
  - e2e
  - p1
---
- launchApp:
    clearState: true
    stopApp: true
- waitForAnimationToEnd:
    timeout: 20000
- tapOn:
    text: "Wait"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
# Wait for bootstrap to fully complete
- extendedWaitUntil:
    visible:
      id: "ModifierBar"
    timeout: 60000
- assertVisible:
    id: "TerminalContent"
- waitForAnimationToEnd:
    timeout: 5000
# Type some text we can select
- tapOn:
    id: "TerminalContent"
- waitForAnimationToEnd:
    timeout: 3000
- inputText: "echo COPY_PASTE_TARGET"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 3000
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 1000
# Long press on terminal content to trigger selection mode
- longPressOn:
    id: "TerminalContent"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: selection_copy_visible
# 选择菜单是 PopupWindow（独立系统窗口，见 TerminalSurface.selectionMenuPopup）：
# Maestro 看不到其中的文本按钮，不做断言、不做点击；菜单内容由 cucumber
# 选择场景覆盖。用产品支持的 Back 路径退出选择。
- waitForAnimationToEnd:
    timeout: 1000
# 用返回键退出选择（产品支持的 dismiss 路径，TerminalScreen BackHandler）：
# Popup 显示期间 Maestro 看不到主窗口节点，必须先退出选择再继续。
- pressKey: Back
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: selection_cleared
- assertVisible:
    id: "TerminalContent"
- assertVisible:
    id: "ModifierBar"
# 退出选择后终端仍可输入
- tapOn:
    id: "TerminalContent"
- waitForAnimationToEnd:
    timeout: 2000
- inputText: "echo COPY_PASTE_BACK_OK"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: copy_paste_complete
