appId: com.termux
name: "Regression  #15/#16: selection drag determinism (pointerId lock)"
tags:
  - e2e
  - regression
---
- launchApp:
    clearState: false
    stopApp: true
- waitForAnimationToEnd:
    timeout: 20000
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible:
      id: "TerminalScreen"
    timeout: 30000
- longPressOn:
    id: "TerminalContent"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: regress-drag-start
# Deterministic single-pointer drag: selection endpoints must follow the
# pointer exactly (pointerId lock prevents phantom-finger drift).
- swipe:
    start: "50%, 60%"
    end: "50%, 40%"
    duration: 600
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: regress-drag-end
