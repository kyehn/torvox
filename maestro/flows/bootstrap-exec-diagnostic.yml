appId: com.termux
name: Diagnose guest-binary exec from app context (nix bootstrap)
tags:
  - e2e
---
# Exec-diagnostic probe. Assumes a bootstrap is ALREADY installed and the
# terminal is reachable (system shell or nix shell — either works, since
# the probe commands only need $PREFIX). Reconstructs the RC=126 verdict
# procedure: direct-exec the dynamic store nix AND the static proot from
# the app process context, capturing return codes. Store hashes are
# glob-resolved at runtime — nothing hardcoded.
#   RC=126 on both  => MAC (execute_no_trans) denial; loader deadlock stands.
#   version output  => execution works; loader verdict refuted, proceed.
# Screenshots are OCR-read outside Maestro.
- launchApp:
    stopApp: true
- waitForAnimationToEnd:
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "TerminalScreen"
    timeout: 30000
- assertVisible:
    id: "TerminalScreen"
- tapOn:
    id: "TerminalContent"
- waitForAnimationToEnd:
    timeout: 3000
- inputText: "cd $PREFIX/nix/store"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 3000
- inputText: "for n in *-nix-*/bin/nix;do $n --version;done"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 15000
- inputText: "echo NIX_RC=$?"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 3000
- inputText: "for p in *-proot-*/bin/proot;do $p --version;done"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 15000
- inputText: "echo PROOT_RC=$?"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: nix_exec_diagnostic
