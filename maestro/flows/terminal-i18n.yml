appId: com.termux
name: Terminal i18n verification
tags:
  - e2e
  - p1
---
- launchApp:
    clearState: true
    stopApp: true
- waitForAnimationToEnd:
    timeout: 20000
- tapOn:
    text: "Wait"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "TerminalScreen"
    timeout: 30000
- assertVisible:
    id: "TerminalScreen"
- assertVisible:
    id: "ModifierBar"
- assertVisible:
    id: "TerminalContent"
# Open settings via drawer (tap, not swipe — edge swipe hits the
# system back-gesture on gesture-nav devices)
- tapOn:
    id: "Key_DRAWER"
- extendedWaitUntil:
    visible:
      id: "SessionDrawer"
    timeout: 15000
- tapOn:
    id: "SettingsButton"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "SettingsScreen"
# 中文单语言：验证中文 UI 字符串
- assertVisible:
    text: "外观"
- assertVisible:
    text: "字体大小"
- scrollUntilVisible:
    element:
      text: "软件主题"
    direction: DOWN
- assertVisible:
    text: "软件主题"
- scrollUntilVisible:
    element:
      text: "终端主题"
    direction: DOWN
- assertVisible:
    text: "终端主题"
- scrollUntilVisible:
    element:
      text: "跟随系统"
    direction: DOWN
- assertVisible:
    text: "跟随系统"
- assertVisible:
    id: "TerminalThemeFollowSystemSwitch"
- scrollUntilVisible:
    element:
      text: "终端"
    direction: DOWN
- assertVisible:
    text: "终端"
# Shell 行位于 Terminal 分区标题下方，标题滚入视口时内容可能仍在屏外，
# 直接断言会 flaky，必须显式滚到 Shell。
- scrollUntilVisible:
    element:
      text: "壳"
    direction: DOWN
- assertVisible:
    text: "壳"
- takeScreenshot: i18n_chinese
# Back to terminal
- tapOn:
    id: "SettingsBackButton"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "TerminalScreen"
