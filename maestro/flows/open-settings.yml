appId: com.termux
name: Open settings and navigate back
tags:
  - smoke
  - p1
---
- launchApp:
    clearState: true
    stopApp: true
- waitForAnimationToEnd:
    timeout: 20000
- tapOn:
    text: "Wait"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "TerminalScreen"
    timeout: 30000
- assertVisible:
    id: "TerminalScreen"
# Open drawer via tap (swipe from 3% is intercepted by the system
# back-gesture on gesture-nav devices)
- tapOn:
    id: "Key_DRAWER"
- extendedWaitUntil:
    visible:
      id: "SessionDrawer"
    timeout: 15000
- tapOn:
    id: "SettingsButton"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "SettingsScreen"
- assertVisible:
    text: "外观"
- scrollUntilVisible:
    element:
      text: "字体大小"
    direction: DOWN
- assertVisible:
    text: "字体大小"
- scrollUntilVisible:
    element:
      text: "终端主题"
    direction: DOWN
- assertVisible:
    text: "终端主题"
- scrollUntilVisible:
    element:
      text: "终端"
    direction: DOWN
- assertVisible:
    text: "终端"
- tapOn:
    id: "SettingsBackButton"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "TerminalScreen"
- takeScreenshot: settings_roundtrip
