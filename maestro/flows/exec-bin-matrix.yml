appId: com.termux
name: exec-bin experiment matrix E1-E7
tags:
  - nix
---
# Prereqs: fork bootstrap installed (bin/login present),
# files/exec-bin staged by the app, Shizuku switch OFF.
# Session MUST be failsafe: without Shizuku the app's auto-spawn of
# bin/login cannot succeed (bionic linker vs glibc NEEDED), leaving a
# dead session with no live shell. Harness starts failsafe via the
# setup channel BEFORE this flow (MainActivity read the
# com.termux.app.failsafe_session extra with ACTION_RUN):
#   adb shell am start -n com.termux/terminal.emulator.MainActivity
#     -a android.intent.action.RUN
#     --ez com.termux.app.failsafe_session true
# Every step below is real terminal input; screenshots carry overlay
# text. adb is used only for setup/install/push/screenshot-readback,
# never for executing validation commands.
- extendedWaitUntil:
    visible:
      id: "TerminalScreen"
    timeout: 15000
- tapOn:
    id: "TerminalContent"
- waitForAnimationToEnd:
    timeout: 3000
# Short shell vars keep lines lint-clean; one persistent session.
- inputText: "P=/data/data/com.termux/files;E=$P/exec-bin;U=$P/usr/bin"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 5000
# E1: direct exec of the fork Go login (authentic binary, no tricks).
- inputText: "$U/login --dry-run; echo E1-RC=$?"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 20000
- takeScreenshot: exec_e1_direct
# E2: via the system linker (glibc NEEDED failure expected).
- tapOn:
    id: "TerminalContent"
- inputText: "/system/bin/linker64 $U/login --dry-run; echo E2-RC=$?"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 20000
- takeScreenshot: exec_e2_linker
# E3: via exec-bin chain-load (core proof).
- tapOn:
    id: "TerminalContent"
- inputText: "$E $U/login --dry-run; echo E3-RC=$?"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 30000
- takeScreenshot: exec_e3_execbin_dryrun
# E4: full login through exec-bin (the crux: login runs proot via
# raw syscall.Exec; the device gives a loud verdict, recorded as-is).
# login owns the PTY until its guest shell exits.
- tapOn:
    id: "TerminalContent"
- inputText: "$E $U/login"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 90000
- takeScreenshot: exec_e4_login
# Leave the guest (or the failed login) to reclaim the host shell.
- inputText: "exit"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 20000
- tapOn:
    id: "TerminalContent"
- inputText: "echo E4-RC=$?"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: exec_e4_rc
# E5: exec-bin starts prefix bash (builtins only).
- tapOn:
    id: "TerminalContent"
- inputText: "$E $U/sh -c 'echo E5-HI'; echo E5-RC=$?"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 30000
- takeScreenshot: exec_e5_bash
# E6: exec-bin starts static proot (linker-mapped).
- tapOn:
    id: "TerminalContent"
- inputText: "$E $U/proot --version; echo E6-RC=$?"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 30000
- takeScreenshot: exec_e6_proot_version
