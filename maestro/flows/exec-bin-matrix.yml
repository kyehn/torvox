appId: com.termux
name: exec-bin experiment matrix E1-E7
tags:
  - nix
---
# Prereqs: fork bootstrap installed (bin/login present),
# files/exec-bin staged by the app, Shizuku switch OFF.
# Every step is real terminal input; screenshots carry overlay text.
# adb is used only for install/push/screenshot-readback.
- extendedWaitUntil:
    visible:
      id: "TerminalScreen"
    timeout: 15000
- tapOn:
    id: "TerminalContent"
- waitForAnimationToEnd:
    timeout: 3000
# Short shell vars keep lines lint-clean; one persistent session.
- inputText: "P=/data/data/com.termux/files;E=$P/exec-bin;U=$P/usr/bin"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 5000
# E1: direct exec of the fork Go login (authentic binary, no tricks).
- inputText: "$U/login --dry-run; echo E1-RC=$?"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 20000
- takeScreenshot: exec_e1_direct
# E2: via the system linker (glibc NEEDED failure expected).
- tapOn:
    id: "TerminalContent"
- inputText: "/system/bin/linker64 $U/login --dry-run; echo E2-RC=$?"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 20000
- takeScreenshot: exec_e2_linker
# E3: via exec-bin chain-load (core proof).
- tapOn:
    id: "TerminalContent"
- inputText: "$E $U/login --dry-run; echo E3-RC=$?"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 30000
- takeScreenshot: exec_e3_execbin_dryrun
# E5: exec-bin starts prefix bash (builtins only).
- tapOn:
    id: "TerminalContent"
- inputText: "$E $U/sh -c 'echo E5-HI'; echo E5-RC=$?"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 30000
- takeScreenshot: exec_e5_bash
# E6: exec-bin starts static proot (linker-mapped).
- tapOn:
    id: "TerminalContent"
- inputText: "$E $U/proot --version; echo E6-RC=$?"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 30000
- takeScreenshot: exec_e6_proot_version
