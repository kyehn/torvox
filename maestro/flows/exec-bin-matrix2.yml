appId: com.termux
name: exec-bin matrix2 ls E5 E6 E3dry E7dry
tags:
  - nix
---
# Prereqs: fork bootstrap installed, new files/exec-bin staged by the app,
# fresh failsafe session via the setup channel BEFORE this flow:
#   adb shell am start -n com.termux/terminal.emulator.MainActivity
#     -a android.intent.action.RUN
#     --ez com.termux.app.failsafe_session true
# No `exit` in this flow: a failed login already returns to the host shell,
# and `exit` would kill the host shell itself (lesson from matrix-1 E4-RC).
# Every step is real terminal input; screenshots carry overlay text.
- extendedWaitUntil:
    visible:
      id: "TerminalScreen"
    timeout: 15000
- tapOn:
    id: "TerminalContent"
- waitForAnimationToEnd:
    timeout: 3000
- inputText: "P=/data/data/com.termux/files;E=$P/exec-bin;U=$P/usr/bin"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 5000
# E7-LS: exact shape of the prefix bin dir (login-inner vs .new, modes).
- inputText: "ls -la $U/ | head -n 30; echo E7-LS=$?"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: exec_e7_ls
# E5: linker-mapped exec-bin starts prefix bash (builtins only).
- tapOn:
    id: "TerminalContent"
- inputText: "/system/bin/linker64 $E $U/sh -c 'echo E5-HI'; echo E5=$?"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 30000
- takeScreenshot: exec_e5_bash
# E6: linker-mapped exec-bin starts static proot.
- tapOn:
    id: "TerminalContent"
- inputText: "/system/bin/linker64 $E $U/proot --version; echo E6=$?"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 30000
- takeScreenshot: exec_e6_proot_version
# E3: via linker-mapped exec-bin (fixed routing: direct linker load).
- tapOn:
    id: "TerminalContent"
- inputText: "/system/bin/linker64 $E $U/login --dry-run; echo E3=$?"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 30000
- takeScreenshot: exec_e3_execbin_dryrun
