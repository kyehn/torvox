appId: com.termux
---
# Test multiple session management
- launchApp:
    appId: "com.termux"
    clearState: true
- extendedWaitUntil:
    visible: "TerminalScreen"
    timeout: 30000
# Open drawer and add session
- tapOn: "Key_DRAWER"
- extendedWaitUntil:
    visible: "New session"
    timeout: 10000
- tapOn: "New session"
- extendedWaitUntil:
    visible: "TerminalScreen"
    timeout: 30000
# Verify session drawer has 2 sessions
- tapOn: "Key_DRAWER"
- extendedWaitUntil:
    visible: "Session"
    timeout: 10000
# Close drawer
- tapOn:
    point: "10%,10%"
- extendedWaitUntil:
    visible: "TerminalScreen"
    timeout: 30000
