appId: com.termux
name: exec-bin E7 full login
tags:
  - nix
---
# Prereqs: matrix2 session still alive (no exit in that flow), new exec-bin
# staged, login-inner present (E3 dry-run passed stat). Full login takes over
# the PTY until the guest exits; no `exit` afterwards (a failed login already
# returns to the host shell, and `exit` would kill it).
# Every step is real terminal input; screenshots carry overlay text.
- extendedWaitUntil:
    visible:
      id: "TerminalScreen"
    timeout: 15000
- tapOn:
    id: "TerminalContent"
- waitForAnimationToEnd:
    timeout: 3000
- inputText: "P=/data/data/com.termux/files;E=$P/exec-bin;U=$P/usr/bin"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 5000
- inputText: "/system/bin/linker64 $E $U/login; echo E7-RC=$?"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 90000
- takeScreenshot: exec_e7_login
