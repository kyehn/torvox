appId: com.termux
name: Probe post-install shell over IME (nix bootstrap)
tags:
  - nix
---
# Post-install shell probe. Assumes a bootstrap is ALREADY installed
# (by bootstrap-install-offline.yml); this flow never clears state and
# never reinstalls, so it runs in seconds. It answers the loader
# question: with the isInstalled() nix fix in the APK, a nix bootstrap
# must yield the store bash (SHELL under nix/store); without it, the
# failsafe system shell (/system/bin/sh) appears instead.
# Screenshots are OCR-read outside Maestro.
- launchApp:
    stopApp: true
- waitForAnimationToEnd:
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "TerminalScreen"
    timeout: 30000
- assertVisible:
    id: "TerminalScreen"
- tapOn:
    id: "TerminalContent"
- waitForAnimationToEnd:
    timeout: 3000
- inputText: "echo SHELL=$SHELL PREFIX=$PREFIX"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 3000
- inputText: "nix --version"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: nix_shell_probe
