appId: com.termux
name: Install nix-on-droid bootstrap from file (offline)
tags:
  - nix
---
# Prerequisite (staged outside this flow): push the bootstrap zip to
# shared storage first:
#   adb push nix-bootstrap-x86_64.zip /sdcard/Download/nix-bootstrap-x86_64.zip
# Uses the "Install from File" button (OfflineInstallButton) + system
# file picker. No network required.
- launchApp:
    clearState: true
    stopApp: true
- waitForAnimationToEnd:
    timeout: 20000
- tapOn:
    text: "Allow"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "TerminalScreen"
    timeout: 30000
- assertVisible:
    id: "TerminalScreen"
# Open drawer and enter Settings (same path as open-settings.yml).
- tapOn:
    id: "Key_DRAWER"
- extendedWaitUntil:
    visible:
      id: "SessionDrawer"
    timeout: 15000
- tapOn:
    id: "SettingsButton"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "SettingsScreen"
# Scroll to the Bootstrap section's offline button.
- scrollUntilVisible:
    element:
      id: "OfflineInstallButton"
    direction: DOWN
- tapOn:
    id: "OfflineInstallButton"
# System file picker (DocumentsUI): open roots, go to Downloads,
# pick the staged zip. Picker layout varies by image; each step is
# optional except the final file tap, and the flow is re-run
# until the install succeeds ("循环直到成功安装").
- tapOn:
    text: "Show roots"
    optional: true
# "Show roots"/"Downloads" matched the real DocumentsUI (device-verified);
# the bare "Download" variant never exists (WARNED twice) and is dropped.
- tapOn:
    text: "Downloads"
    optional: true
# The file list may need scrolling on small screens; scroll first
# so the required tap below cannot miss an off-screen entry.
- scrollUntilVisible:
    element:
      text: "nix-bootstrap-x86_64.zip"
    direction: DOWN
    timeout: 30000
    optional: true
# Driver-death lesson (device-verified 2026-09-07): Maestro's driver
# stream can die during the 20+ min extract (gRPC UNAVAILABLE), killing
# any in-Maestro long wait. So this flow ends at the zip tap; completion
# is polled OUTSIDE Maestro (termux.env appearance) by the loop script.
- tapOn:
    text: "nix-bootstrap-x86_64.zip"
# Flow ends here by design (see note above): the relaunch + IME shell
# probe live in bootstrap-nix-shell-probe.yml and run only after the
# loop script observes termux.env (install complete). Relaunching here
# would force-stop the installer mid-extract.
