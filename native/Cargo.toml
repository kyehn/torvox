[package]
name = "native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Terminal engine"
[lints]
workspace = true
[lib]
crate-type = ["cdylib", "lib"]
[dependencies]
base64 = { workspace = true }
bytemuck = { workspace = true }
cosmic-text = { workspace = true }
flume = { workspace = true }
foldhash = "0.2"
fontdb = { workspace = true }
futures = { workspace = true }
guillotiere = { workspace = true }
jni = { workspace = true }
libc = { workspace = true }
libghostty-vt = { workspace = true, features = ["png"] }
linkify = "0.11"
log = { workspace = true }
lru = { workspace = true }
nix = { workspace = true }
parking_lot = "0.12"
png = { workspace = true }
raw-window-handle = { workspace = true }
regex = "1"
roxmltree = "0.21"
serde = { workspace = true }
serde_json = "1"
swash = { workspace = true }
thiserror = { workspace = true }
# DESIGN.md 规定仅 Vulkan 后端且禁止 OpenGL 回退，因此关闭默认特性，
# 不让 gles / dx12 / metal / webgpu 后端编入产物（默认特性会引入 EGL 与 glow）。
wgpu = { workspace = true, default-features = false, features = [
  "std",
  "wgsl",
  "vulkan",
] }
wgpu-types = { workspace = true }
[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = [
  "cargo_bench_support",
] }
cucumber = "0.23"
proptest = { workspace = true }
shuttle = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
[[test]]
name = "bdd"
path = "tests/bdd/main.rs"
harness = false
[[bench]]
name = "cell_builder"
path = "benches/cell_builder.rs"
harness = false
[[bench]]
name = "vt_typing"
path = "benches/vt_typing.rs"
harness = false
[[bench]]
name = "cjk_resolve"
path = "benches/cjk_resolve.rs"
harness = false
