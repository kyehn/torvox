[package]
name = "native"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Terminal engine"
[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
[lib]
crate-type = ["cdylib", "lib"]
[dependencies]
base64 = "0.23"
bytemuck = { version = "1", features = ["derive"] }
cosmic-text = "0.19"
flume = "0.12"
foldhash = "0.2"
fontdb = "0.23"
futures = "0.3"
guillotiere = "0.7"
jni = { version = "0.22", default-features = false }
libc = "0.2"
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "d2036baeb605d31d09a9e2ba6d0c923e04c34d54", features = [
  "log",
  "png",
] }
log = "0.4"
lru = "0.18"
nix = { version = "0.31", features = ["term", "process", "signal", "fs"] }
parking_lot = "0.12"
raw-window-handle = "0.6"
roxmltree = "0.21"
serde = { version = "1", default-features = false, features = [
  "derive",
  "alloc",
] }
serde_json = "1"
swash = "0.2"
thiserror = { version = "2", default-features = false }
toml = "1"
unicode-script = "0.5"
wgpu = { version = "30", default-features = false, features = [
  "std",
  "wgsl",
  "vulkan",
] }
wgpu-types = "30"
[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = [
  "cargo_bench_support",
] }
cucumber = "0.23"
proptest = "1.11"
shuttle = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
[[test]]
name = "bdd"
path = "tests/bdd/main.rs"
harness = false
[[bench]]
name = "cell_builder"
path = "benches/cell_builder.rs"
harness = false
[[bench]]
name = "vt_typing"
path = "benches/vt_typing.rs"
harness = false
[[bench]]
name = "cjk_resolve"
path = "benches/cjk_resolve.rs"
harness = false
