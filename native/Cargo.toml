[package]
name = "native"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Terminal engine"

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
[lib]
crate-type = ["cdylib", "lib"]
[dependencies]
base64 = "0.23"
bytemuck = { version = "1", features = ["derive"] }
cosmic-text = "0.19"
flume = "0.12"
foldhash = "0.2"
# 上游阻断：`cosmic-text 0.19.0`（最新版）要求 `fontdb ^0.23`，本仓的
# `fontdb::ID` 与 `cosmic_text::fontdb::ID` 必须是同一版本，故 0.24 不可用。
fontdb = "0.23"
pollster = "1"
etagere = "0.3"
jni = { version = "0.22", default-features = false }
libc = "0.2"
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "9ede35b8ea94a55ed3608408d67e102883129f1e", features = [
  "log",
  "png",
] }
log = "0.4"
lru = "0.19"
nix = { version = "0.31", features = [
  "term",
  "process",
  "signal",
  "fs",
  "poll",
] }
parking_lot = "0.13"
raw-window-handle = "0.6"
roxmltree = "0.21"
serde = { version = "1", default-features = false, features = [
  "derive",
  "alloc",
] }
serde_json = "1"
swash = "0.2"
thiserror = { version = "2", default-features = false }
toml = "1"
unicode-script = "0.5"
wgpu = { version = "30", default-features = false, features = [
  "std",
  "wgsl",
  "vulkan",
] }
wgpu-types = "30"
[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = [
  "cargo_bench_support",
] }
proptest = "1.12"
shuttle = "0.9"
tempfile = "3"
[[bench]]
name = "cell_builder"
path = "benches/cell_builder.rs"
harness = false
[[bench]]
name = "vt_typing"
path = "benches/vt_typing.rs"
harness = false
[[bench]]
name = "cjk_resolve"
path = "benches/cjk_resolve.rs"
harness = false

[profile.release]
# panic 键不设（默认 unwind）：JNI 导出守卫的 panic 处理链依赖展开，
# 置 abort 会让守卫接住的 panic 直接终止进程。
lto = true
codegen-units = 1
opt-level = "z"
strip = true
