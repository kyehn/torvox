[package]
name = "native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "terminal engine, GPU renderer, JNI bridge"
[lib]
crate-type = ["cdylib", "lib"]
[dependencies]
nix = { workspace = true }
libc = { workspace = true }
flume = { workspace = true }
foldhash = "0.2"
parking_lot = "0.12"
log = { workspace = true }
regex = "1"
linkify = "0.11"
lru = { workspace = true }
strsim = { workspace = true }
shell-words = { workspace = true }
futures = { workspace = true }
bytemuck = { workspace = true }
thiserror = { workspace = true }
roxmltree = "0.20"
libghostty-vt = { workspace = true, features = ["png"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
base64 = "0.23"
wgpu = { workspace = true, features = ["spirv", "gles", "vulkan"] }
raw-window-handle = { workspace = true }
wgpu-types = { workspace = true }
cosmic-text = { workspace = true }
fontdb = { workspace = true }
swash = { workspace = true }
guillotiere = { workspace = true }
jni = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1"], optional = true }
tokio = { version = "1", default-features = false, features = ["net", "rt", "sync", "macros", "time"], optional = true }
schemars = { version = "1", features = ["derive"], optional = true }
[target.'cfg(not(target_os = "android"))'.dependencies]
renderdoc = "0.12.1"
[dev-dependencies]
naga = { version = "30", default-features = false, features = ["wgsl-in", "spv-out"] }
image = { workspace = true }
proptest = { workspace = true }
toml = { workspace = true }
shuttle = "0.9"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
[lints]
workspace = true
