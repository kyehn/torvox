[workspace]
resolver = "2"
members = [
  "native",
  "exec-bin",
  "integration-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"


[workspace.dependencies]
native = { path = "native" }

libc = "0.2"
nix = { version = "0.31", features = ["term", "process", "signal", "fs"] }
serde = { version = "1", default-features = false, features = [
  "derive",
  "alloc",
] }
thiserror = { version = "2", default-features = false }
wgpu = "30"
wgpu-types = "30"
raw-window-handle = "0.6"
bytemuck = { version = "1", features = ["derive"] }
cosmic-text = "0.19"
fontdb = "0.23"
swash = "0.2"
guillotiere = "0.7"
jni = { version = "0.21", default-features = false }

flume = "0.12"

# Testing infrastructure
proptest = "1.11"
lru = "0.18"
futures = "0.3"
log = "0.4"
toml = "1"
image = "0.25"
strsim = "0.11"

libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "de9fd9b0fa4ab53faebd3d489f4c74fe0ec832ec" }
libghostty-vt-sys = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "de9fd9b0fa4ab53faebd3d489f4c74fe0ec832ec" }

[profile.dev]
incremental = true
opt-level = 1
debug = "line-tables-only"
strip = "none"

[profile.release]
# 显式声明以锁定体积语义：BUILD.md 要求 release/dev/debug .so 大小
# 必须合理、过大必归因。Cargo 默认 release 已为 opt-level=3 /
# strip=debuginfo；此处保留默认优化等级，仅显式声明 strip 以与
# build-android-libs.nu 的 60MB 上限及 NEEDED 校验对齐（实测 release
# ~16MB 静联 libghostty-vt，不含 NEEDED；debug ~127MB 带符号）。
# 不启用 opt-level="s"/lto/codegen-units=1：体积已达标，激进 LTO 会
# 显著拉长 CI release 构建时间，得不偿失。
strip = "debuginfo"

[profile.dev-android]
inherits = "dev"
strip = "debuginfo"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
doc_markdown = "allow"
match_same_arms = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
return_self_not_must_use = "allow"
wildcard_enum_match_arm = "allow"
elidable_lifetime_names = "allow"
match_wildcard_for_single_variants = "allow"
pub_underscore_fields = "allow"
missing_const_for_fn = "allow"
items_after_statements = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
fn_params_excessive_bools = "allow"
wildcard_imports = "allow"
module_inception = "allow"
if_not_else = "allow"
implicit_clone = "allow"
default_trait_access = "allow"
manual_let_else = "allow"
ref_as_ptr = "allow"
used_underscore_items = "allow"
used_underscore_binding = "allow"
ignored_unit_patterns = "allow"
unnecessary_cast = "allow"
bool_to_int_with_if = "allow"
map_unwrap_or = "allow"
collapsible_else_if = "allow"
redundant_closure_for_method_calls = "allow"
single_match_else = "allow"
semicolon_if_nothing_returned = "allow"
unnecessary_debug_formatting = "allow"
unused_self = "allow"
format_push_string = "allow"
borrow_as_ptr = "allow"
assigning_clones = "allow"
ptr_as_ptr = "allow"
cast_lossless = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
uninlined_format_args = "allow"
ptr_arg = "allow"
ref_option = "allow"
