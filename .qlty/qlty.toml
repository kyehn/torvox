# Qlty 配置：只启用项目自身门禁没有覆盖的插件。
# 项目已用 spotless/detekt（Kotlin 风格与复杂度）、scripts/check.nu（semgrep 规则）把关；
# qlty 的 ktlint/radarlint/semgrep 使用不同规则源，重复运行只会制造与新代码无关的噪声。
config_version = "0"

exclude_patterns = [
  "**/build/**",
  "**/target/**",
  "**/node_modules/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*_test.*",
  "**/*_spec.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

[[plugin]]
name = "actionlint"

[[plugin]]
name = "clippy"

[[plugin]]
name = "editorconfig-checker"
mode = "comment"

[[plugin]]
name = "ktlint"
mode = "disabled"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "radarlint-kotlin"
mode = "disabled"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "semgrep"
mode = "disabled"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"
